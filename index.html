<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CivicSence — AI-powered, politically neutral election education assistant for India. Find your booth, compare candidates, track live results, and learn your voting rights." />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="CivicSence Team" />
    <meta name="keywords" content="elections, India, voter education, ECI, civic assistant, AI, Gemini, Google, Karnataka" />
    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="CivicSence — AI Election Education Assistant" />
    <meta property="og:description" content="AI-powered voter education: booth finder, candidate comparator, live results, and civic quiz for Indian elections." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <!-- DNS prefetch for external domains -->
    <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com" />
    <link rel="dns-prefetch" href="https://api.data.gov.in" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Async font loading: prevent render-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" /></noscript>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>" />
    <title>CivicSence — AI Election Education Assistant</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run CivicSence.</noscript>
    <!-- Inline critical CSS: eliminates CLS during React hydration -->
    <style>
      body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#000;color:#fff}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .sr-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:1.25rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    </style>
    <div id="root"><div class="sr-loading" aria-label="Loading CivicSence">CIVICSENCE</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
